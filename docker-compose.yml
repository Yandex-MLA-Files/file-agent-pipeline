# Explicit project name: the default (current directory's basename,
# "file-agent-pipeline") collides with a teammate's identically-named clone
# on the same shared Docker daemon, making `docker compose` report their
# containers as "orphans" of this project. An explicit name here removes the
# ambiguity for good (does not affect the already-prefixed container_name
# values, only project-level bookkeeping like orphan detection and the
# volume-name prefix).
name: file-agent-aa

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@file-agent-langfuse-postgres:5432/langfuse
  CLICKHOUSE_URL: http://file-agent-langfuse-clickhouse:8123
  # Separate from CLICKHOUSE_URL (HTTP interface, used for queries) - the
  # migration step needs the native protocol port (9000), exposed by the
  # clickhouse-server image by default even with no explicit `ports:` here
  # (reachable from other containers on file-agent-langfuse-net regardless).
  CLICKHOUSE_MIGRATION_URL: clickhouse://file-agent-langfuse-clickhouse:9000
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  # Single standalone ClickHouse node, no Zookeeper/cluster - without this,
  # migrations default to `ON CLUSTER default` + ReplicatedMergeTree, which
  # fail outright on a non-clustered node.
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD}@file-agent-langfuse-redis:6379
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://file-agent-langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_SECRET_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    user: root
    network_mode: host
    restart: unless-stopped
    environment:
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger_data:/badger

  vllm:
    image: vllm/vllm-openai:v0.7.3
    container_name: file-agent-vllm
    network_mode: host
    restart: unless-stopped
    ipc: host
    environment:
      - VLLM_USE_V1=0
      - VLLM_ATTENTION_BACKEND=XFORMERS
    command:
      - --model
      - Qwen/Qwen2.5-7B-Instruct
      - --dtype
      - half
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.90"
      - --enforce-eager
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    volumes:
      - /mnt/storage-1/file-agent-pipe/huggingface/vllm:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  app:
    build: .
    container_name: file-agent-app
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /mnt/storage-1/file-agent-pipe/huggingface/pipeline:/root/.cache/huggingface
      - /mnt/storage-1/file-agent-pipe/easyocr:/root/.EasyOCR
      - /mnt/storage-1/file-agent-pipe/logs/app:/app/logs
    depends_on:
      - vllm
      - jaeger

  # Own self-hosted Langfuse stack for the ReAct agent's LLM-turn/tool-call
  # tracing (separate from OTel/Jaeger, which keeps tracing the parsing/
  # chunking/retrieval layers unchanged). Deliberately NOT on network_mode:
  # host and NOT using the plain "langfuse-*" names other project clones on
  # this shared box already use - only langfuse-web publishes a host port,
  # on 127.0.0.1:3050 instead of the default 3000, to avoid colliding with
  # a teammate's own stack. Verify that port is actually free before first
  # bring-up (`ss -tlnp`).
  file-agent-langfuse-postgres:
    image: postgres:16
    container_name: file-agent-langfuse-postgres
    restart: unless-stopped
    networks: [file-agent-langfuse-net]
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=${LANGFUSE_POSTGRES_PASSWORD}
      - POSTGRES_DB=langfuse
    volumes:
      - file_agent_langfuse_postgres_data:/var/lib/postgresql/data

  file-agent-langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: file-agent-langfuse-clickhouse
    restart: unless-stopped
    networks: [file-agent-langfuse-net]
    environment:
      - CLICKHOUSE_USER=langfuse
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - file_agent_langfuse_clickhouse_data:/var/lib/clickhouse

  file-agent-langfuse-redis:
    image: redis:7-alpine
    container_name: file-agent-langfuse-redis
    restart: unless-stopped
    networks: [file-agent-langfuse-net]
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD}"]

  file-agent-langfuse-minio:
    image: minio/minio:latest
    container_name: file-agent-langfuse-minio
    restart: unless-stopped
    networks: [file-agent-langfuse-net]
    command: server /data
    environment:
      - MINIO_ROOT_USER=${LANGFUSE_S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${LANGFUSE_S3_SECRET_KEY}
    volumes:
      - file_agent_langfuse_minio_data:/data

  # MinIO doesn't auto-create buckets. One-shot job: waits for MinIO, creates
  # the "langfuse" bucket if missing, exits. web/worker wait for it to exit
  # 0 (service_completed_successfully) before starting, so ingestion never
  # races an empty bucket (this bit us once already - S3 uploads failed with
  # NoSuchBucket on a fresh stack).
  file-agent-langfuse-minio-init:
    image: minio/mc:latest
    container_name: file-agent-langfuse-minio-init
    networks: [file-agent-langfuse-net]
    depends_on:
      - file-agent-langfuse-minio
    entrypoint: >
      sh -c "
      until mc alias set myminio http://file-agent-langfuse-minio:9000 $${LANGFUSE_S3_ACCESS_KEY} $${LANGFUSE_S3_SECRET_KEY}; do sleep 1; done &&
      mc mb --ignore-existing myminio/langfuse
      "
    environment:
      - LANGFUSE_S3_ACCESS_KEY=${LANGFUSE_S3_ACCESS_KEY}
      - LANGFUSE_S3_SECRET_KEY=${LANGFUSE_S3_SECRET_KEY}
    restart: "no"

  file-agent-langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: file-agent-langfuse-worker
    restart: unless-stopped
    networks: [file-agent-langfuse-net]
    depends_on:
      file-agent-langfuse-postgres:
        condition: service_started
      file-agent-langfuse-clickhouse:
        condition: service_started
      file-agent-langfuse-redis:
        condition: service_started
      file-agent-langfuse-minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env

  file-agent-langfuse-web:
    image: langfuse/langfuse:3
    container_name: file-agent-langfuse-web
    restart: unless-stopped
    networks: [file-agent-langfuse-net]
    ports:
      - "127.0.0.1:3050:3000"
    depends_on:
      file-agent-langfuse-worker:
        condition: service_started
      file-agent-langfuse-minio-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3050
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}

  # Own self-hosted MLflow for eval_pipeline experiment tracking (params +
  # RagasJudge metrics per run — v0/v1/v2 comparison). A teammate already
  # runs a container literally named "file-agent-mlflow" on 0.0.0.0:5000 on
  # this shared box, so this one uses a distinct name/port and stays on
  # localhost only. SQLite backend store is enough at this scale — no
  # separate Postgres needed, unlike Langfuse.
  file-agent-mlflow-eval:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: file-agent-mlflow-eval
    restart: unless-stopped
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - file_agent_mlflow_data:/mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"

networks:
  file-agent-langfuse-net:
    name: file-agent-langfuse-net

volumes:
  jaeger_data:
  file_agent_langfuse_postgres_data:
  file_agent_langfuse_clickhouse_data:
  file_agent_langfuse_minio_data:
  file_agent_mlflow_data:
