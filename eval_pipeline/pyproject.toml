[project]
name = "eval-pipeline"
version = "0.1.0"
description = "LLM-as-judge evaluation for RAG answers"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "ragas>=0.3.9,<0.4",
    "langchain-community<0.4",
    "langchain-openai>=1.0",
    "sentence-transformers>=3.0",
    "langchain-huggingface>=1.2.2",
    "mlflow>=2.16",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]
